apiVersion: apps/v1
kind: Deployment
metadata:
    name: php-deploy
spec:
    replicas: 2
    selector:
        matchLabels:
            app: php
    template:
        metadata:
            labels:
                app: php
        spec:
            imagePullSecrets:
              - name: dockerhub-secret
            containers:
                - name: php-pod
                  image: ahmedshaikh1899/web2
                  imagePullPolicy: IfNotPresent
                  ports:
                    - containerPort: 80
                  envFrom:
                    - configMapRef:
                        name: web-config
                    - secretRef:
                        name: web-secret
                  livenessProbe:
                    httpGet:
                        path: /health.php
                        port: 80
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                        path: /health.php
                        port: 80
                    initialDelaySeconds: 20
                    periodSeconds: 20
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 250m
                      memory: 256Mi
                

